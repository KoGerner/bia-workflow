# addendum.aibcm.org — the OLD public name of the BIA-Workflow MCP, kept answering until Phase C7
# maps it onto https://agent.ai4bcm.org with 301s and retires it (cert `certbot delete` then).
# Canonical copy; the running one is /etc/nginx/sites-available/addendum-aibcm on brain.
# Since Track 2 Stage 2 (2026-08-18) this is nginx-agent-ai4bcm.conf with the old name, cert and
# log files: same pinned listen lines, same /health + /mcp proxy to bia-workflow-mcp on 8787
# (server.py allowed_hosts carries both names), same /demo/… static layout — no /chat (the
# Chainlit lane is retired), no top-level prefixes.

server {
    listen 80;
    listen [::]:80;
    server_name addendum.aibcm.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 95.217.162.203:443 ssl http2;
    listen [2a01:4f9:c013:a840::1]:443 ssl http2;
    server_name addendum.aibcm.org;

    ssl_certificate     /etc/letsencrypt/live/addendum.aibcm.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/addendum.aibcm.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Load-bearing: the live-<hash> directory name IS the gate for the demo embed; without
    # this header it would leak in every Referer to the pages the deck links out to.
    add_header Referrer-Policy "no-referrer" always;

    access_log /var/log/nginx/addendum-aibcm.access.log;
    error_log  /var/log/nginx/addendum-aibcm.error.log warn;

    location = /health {
        proxy_pass http://127.0.0.1:8787/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /mcp {
        proxy_pass http://127.0.0.1:8787/mcp;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Dependency-graph pages — generated and re-generated in-tree by the MCP service
    # (sandbox ReadWritePaths), so they serve from the app checkout, not /var/www. The
    # checkout is root-owned and world-readable; public/graph is chowned to svc-bia.
    location ^~ /demo/graph/ {
        alias /opt/apps/bia-workflow/public/graph/;
        autoindex off;
    }

    # The method itself — the public workflow-design repo (CC BY 4.0), mounted as the
    # checkout's design/ submodule. Phase C8 puts a page in front of it at /demo/design/.
    location ^~ /demo/design/ {
        alias /opt/apps/bia-workflow/design/;
        autoindex off;
    }

    # Knowledge-base pages (build_kb_pages.py → kb/), the BIA-Workflow guide
    # (build_guide_page.py → bia-workflow-guide/), the live-demo sign-in page (bia-live/) and
    # the embed directory only the right password derives (live-<sha256[:16]>/ — the gate is
    # the unguessable directory name; a wrong guess 404s before any byte is served. To
    # rotate: rename the directory. No nginx change.)
    location ^~ /demo/ {
        alias /var/www/addendum-demo/;
        index index.html;
        autoindex off;
    }

    location / {
        return 404;
    }
}
