# agent.ai4bcm.org — the BIA-Workflow MCP's public name (owner ruling 2026-08-17, live 2026-08-18).
# Canonical copy; the running one is /etc/nginx/sites-available/agent-ai4bcm on brain.
#   - listen lines are pinned to brain's public IPs — Tailscale Serve owns the tailnet 443,
#     so a wildcard `listen 443` here would fight it (never wildcard 443 on brain);
#   - /health + /mcp proxy to the bia-workflow-mcp unit on 127.0.0.1:8787;
#   - the static layout is /demo/… ONLY (owner 2026-08-18: /demo/graph/marschkamp/ keeps its
#     path, only the host changes; the top-level /graph/ /kb/ /guide/ /bia-live/ /live-* prefixes
#     that served here during Stage 1 are gone) — /demo/graph/ from the app checkout,
#     /demo/design/ from the workflow-design submodule, everything else from /var/www/addendum-demo;
#   - everything else is 404.
# Both names answer the same process (server.py allowed_hosts) until Phase C7 maps the old
# name onto this one with 301s and retires addendum.aibcm.org (nginx-addendum-aibcm.conf).

# Room files download instead of opening as text tabs (owner 2026-08-25): "attachment" on
# every /demo/rooms/ FILE. The autoindex listing (URI ends '/') keeps rendering — its value
# is the empty string, which nginx drops rather than sends.
map $uri $rooms_content_disposition {
    default "";
    ~^/demo/rooms/.+[^/]$ "attachment";
}

server {
    listen 80;
    listen [::]:80;
    server_name agent.ai4bcm.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 95.217.162.203:443 ssl http2;
    listen [2a01:4f9:c013:a840::1]:443 ssl http2;
    server_name agent.ai4bcm.org;

    ssl_certificate     /etc/letsencrypt/live/agent.ai4bcm.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agent.ai4bcm.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Load-bearing: the live-<hash> directory name IS the gate for the demo embed; without
    # this header it would leak in every Referer to the pages the deck links out to.
    add_header Referrer-Policy "no-referrer" always;

    access_log /var/log/nginx/agent-ai4bcm.access.log;
    error_log  /var/log/nginx/agent-ai4bcm.error.log warn;

    location = /health {
        proxy_pass http://127.0.0.1:8787/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /mcp {
        proxy_pass http://127.0.0.1:8787/mcp;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Dependency-graph pages — generated and re-generated in-tree by the MCP service
    # (sandbox ReadWritePaths), so they serve from the app checkout, not /var/www. The
    # checkout is root-owned and world-readable; public/graph is chowned to svc-bia.
    location ^~ /demo/graph/ {
        alias /opt/apps/bia-workflow/public/graph/;
        autoindex off;
    }

    # The method itself — the public workflow-design repo (CC BY 4.0), mounted as the
    # checkout's design/ submodule. Phase C8 puts a page in front of it at /demo/design/.
    location ^~ /demo/design/ {
        alias /opt/apps/bia-workflow/design/;
        autoindex off;
    }

    # QR claim lane (2026-08-25): one QR on the event wall → the app assigns the first
    # unclaimed biaN room and redirects to the personal-link page. Exact-match outranks
    # the ^~ /demo/ static alias below; without this block every scan 404s off the disk.
    location = /demo/claim {
        proxy_pass http://127.0.0.1:8787/demo/claim;
        proxy_set_header Host $host;
    }

    # Demo rooms (2026-08-24): room code = folder = URL. Root-404 + dotpath-deny ARE the
    # secrecy model — no listing of codes, no reading .versions/; a guessed code yields
    # synthetic fiction (fail2ban and the slug jail stand in front of anything worse).
    location = /demo/rooms/ { return 404; }
    location ^~ /demo/rooms/ {
        alias /srv/addendum/demo-rooms/;
        autoindex on;                 # the estate's only one — per-room listing IS the feature, behind the code
        autoindex_exact_size off;
        charset utf-8;
        types { text/plain md txt jsonl; application/json json; text/html html; }
        default_type text/plain;
        # A room file is a handout — save, don't open (the map keeps the listing clean).
        # add_header here stops inheritance, so the server-level three return by hand:
        # Referrer-Policy is load-bearing for the live-<hash> embed gate.
        add_header Content-Disposition $rooms_content_disposition always;
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        location ~ /\. { return 404; }   # nested on purpose: ^~ suppresses server-level regex locations
    }

    # What's-new page for users — hand-written, not built, so it serves straight from the
    # checkout and an update is a `git pull` in the pull lane. `location =` is exact-match, so
    # it cannot shadow anything else; `alias` to a file needs no index and no autoindex.
    location = /changelog {
        alias /opt/apps/bia-workflow/public/changelog.html;
        default_type text/html;
    }

    # Knowledge-base pages (build_kb_pages.py → kb/), the BIA-Workflow guide
    # (build_guide_page.py → bia-workflow-guide/), the live-demo sign-in page (bia-live/) and
    # the embed directory only the right password derives (live-<sha256[:16]>/ — the gate is
    # the unguessable directory name; a wrong guess 404s before any byte is served. To
    # rotate: rename the directory. No nginx change.)
    location ^~ /demo/ {
        alias /var/www/addendum-demo/;
        index index.html;
        autoindex off;
    }

    location / {
        return 404;
    }
}
