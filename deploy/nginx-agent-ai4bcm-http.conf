# agent.ai4bcm.org — port-80 bootstrap vhost, used ONCE per box: it exists so certbot's
# HTTP-01 challenge has somewhere to land before the TLS vhost (nginx-agent-ai4bcm.conf)
# can be installed. Precedent: brain's addendum-aibcm-http. Install, `certbot certonly
# --webroot -w /var/www/letsencrypt -d agent.ai4bcm.org --key-type ecdsa`, then replace the
# sites-enabled link with nginx-agent-ai4bcm.conf, which carries the same port-80 block.

server {
    listen 80;
    listen [::]:80;
    server_name agent.ai4bcm.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
