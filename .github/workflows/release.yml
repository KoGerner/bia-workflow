name: release

# The tag is the authorisation, as at buzz. There is no GitHub token on the box that builds
# this repo — deploy keys push but cannot use the REST API — so the Release is created here
# with the built-in GITHUB_TOKEN and no secret is ever introduced.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, e.g. v0.1.0'
        required: true

permissions:
  contents: write   # GITHUB_TOKEN is read-only by default; without this the create step 403s.

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # No submodules: this job only reads CHANGELOG.md, and fetching design/ would add a
      # failure mode for nothing.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve the tag
        id: tag
        run: echo "name=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      # A guard that only `exit 0`s ends the STEP, not the job — the later steps still run and
      # publish the junk Release it was meant to stop. So it sets an output the rest gate on,
      # and the job still concludes success: a non-release tag is not a failure.
      - name: Refuse anything that is not vX.Y.Z
        id: guard
        # A case glob cannot say "digits only": v[0-9]*.[0-9]*.[0-9]* accepts v0.0.0-probe,
        # because * matches -probe. Measured on the probe run of 2026-08-25, which sailed
        # through this step. An anchored regex is the check that was meant.
        run: |
          if printf '%s' "${{ steps.tag.outputs.name }}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "not a release tag: ${{ steps.tag.outputs.name }} — nothing published"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract the notes
        if: steps.guard.outputs.ok == 'true'
        run: |
          python3 scripts/changelog_top.py --file CHANGELOG.md \
            --expect "${{ steps.tag.outputs.name }}" > notes.md

      # Create OR update. `gh release create` fails outright on a tag that already has a
      # Release, which meant a wording fix made to CHANGELOG.md after publication could never
      # reach the Release body — and the two are meant to be the same text. Re-pushing the tag
      # now republishes the notes, so the file stays the single source of truth.
      - name: Create or update the Release
        if: steps.guard.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists — updating its notes from CHANGELOG.md"
            gh release edit "$TAG" --title "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md
          fi
